# Local development services; keep credentials in the ignored root .env.
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: microduck
      POSTGRES_USER: microduck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microduck -d microduck"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - "127.0.0.1:16333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
volumes:
  postgres_data:
  qdrant_data:
