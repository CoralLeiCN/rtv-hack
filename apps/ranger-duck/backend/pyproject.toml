[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ranger-duck-backend"
version = "0.1.0"
description = "Read-only VSS search and video backend for Ranger Duck"
requires-python = ">=3.11"
dependencies = ["anyio>=4,<5", "fastapi>=0.115,<1", "httpx>=0.28,<1", "python-dotenv>=1,<2", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
capture = ["weave>=0.52.24,<1"]

[project.scripts]
ranger-duck-review = "ranger_duck.review:main"
ranger-duck-export-captures = "ranger_duck.capture:main"
ranger-duck-serve = "ranger_duck.serve:main"

[tool.setuptools.packages.find]
include = ["ranger_duck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
